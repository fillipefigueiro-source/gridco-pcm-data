name: Atualiza Gestão PCM (a cada 15 min)

# Roda na nuvem do GitHub, sem depender de PC ligado.
# Regenera o gestao_pcm.json a partir da API Fracttal e publica no próprio repo
# (que já é servido pelo GitHub Pages). Só publica quando os dados mudam.
#
# DESDE 28/09/2026: o cron e o amortecedor só ACORDAM o robô; quem decide se a
# rodada acontece é o job `ritmo`, que exige 30 min de descanso depois da última.

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 min (horário UTC; o GitHub pode atrasar em picos)
  repository_dispatch:
    types: [fracttal-mudou]
  workflow_dispatch: {}        # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write              # necessário para o robô commitar o JSON de volta

concurrency:
  group: gestao-pcm            # evita duas execuções simultâneas
  cancel-in-progress: false

jobs:
  # DESCANSO ENTRE RODADAS AUTOMÁTICAS (Levi, 28/09/2026: "reduza para a cada 30 min").
  # Desde 24/09 o limite do Fracttal é de 200 pedidos/min para a EMPRESA inteira: este
  # robô, o da Programação Semanal e o App de Campo dividem a mesma cota. Rodando sem parar, os
  # robôs chegavam a levar 120 dos 200 e o campo ficava com o resto. Em 28/09 o App levou
  # 1.054 recusas em 15 min, e técnico em campo não conseguiu sincronizar.
  #
  # O descanso conta do FIM da última rodada, não do início: em 25/09 a rodada daqui
  # chegou a 80 min. Com "30 min desde o início" ela seguiria emendada, e o campo
  # não ganharia nada.
  #
  # Só o que é automático espera (cron e o amortecedor do webhook). Publicar a semana
  # (push) e o "Run workflow" rodam na hora. Para mudar o descanso, troque o PAUSA_MIN.
  #
  # O nome do workflow continua "(a cada 15 min)" de propósito: o azure-swa.yml o procura
  # pelo nome, e trocar só um dos dois faria o deploy do painel parar sem erro nenhum.
  ritmo:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      rodar: ${{ steps.decide.outputs.rodar }}
    steps:
      - name: Decidir se esta rodada acontece (descanso de 30 min)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PAUSA_MIN: '30'
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, sys, urllib.request

          PAUSA = int(os.environ.get("PAUSA_MIN") or "30")
          EVENTO = os.environ.get("GITHUB_EVENT_NAME", "")


          def decidir(rodar, motivo):
              print(motivo)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("rodar=%s\n" % ("1" if rodar else "0"))
              sys.exit(0)


          # Publicar a semana (push) e o "Run workflow" (manual) nunca esperam: é gente
          # pedindo o dado agora. Só o que é automático respeita o descanso.
          if EVENTO not in ("schedule", "repository_dispatch"):
              decidir(True, "gatilho '%s': roda agora, sem esperar o descanso" % EVENTO)


          def api(caminho):
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/%s" % (os.environ["GITHUB_REPOSITORY"], caminho),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)


          def utc(s):
              return dt.datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=dt.timezone.utc)


          # A rodada que conta é a que TRABALHOU: a deste mesmo robô cujo job `atualizar`
          # chegou a rodar numa máquina (tem passo concluído), tenha ele terminado bem, mal ou
          # cancelado no meio — as três gastaram a cota. As que esta trava deixou de fora
          # terminam com o job "skipped", sem passo nenhum, e não contam; se contassem, o
          # descanso recomeçaria a cada gatilho e o robô nunca mais rodaria. A cancelada
          # ainda na fila também não tem passo e fica de fora.
          try:
              wid = api("actions/runs/%s" % os.environ["GITHUB_RUN_ID"])["workflow_id"]
              fim = None
              # SEM `status=completed` na consulta: com esse filtro o GitHub devolveu, na mesma
              # hora, ora a rodada de 5 min atrás, ora uma de 14/09 (medido em 28/09/2026 neste
              # repositório, que tem dezenas de milhares de rodadas). A lista sem filtro vem na
              # ordem certa; as que ainda não terminaram ficam de fora aqui.
              for run in api("actions/workflows/%s/runs?per_page=30" % wid)["workflow_runs"]:
                  if run.get("status") != "completed":
                      continue
                  for job in api("actions/runs/%s/jobs" % run["id"])["jobs"]:
                      if (job.get("name") == "atualizar" and job.get("completed_at")
                              and any(p.get("conclusion") == "success" for p in job.get("steps") or [])):
                          fim = utc(job["completed_at"])
                          break
                  if fim:
                      break
          except Exception as e:
              # Não saber não é motivo para parar o painel: na dúvida, roda.
              decidir(True, "não consegui ler as rodadas anteriores (%s): roda" % e)

          if fim is None:
              decidir(True, "nenhuma rodada de verdade entre as 30 últimas: roda")
          passou = (dt.datetime.now(dt.timezone.utc) - fim).total_seconds() / 60
          if passou < PAUSA:
              decidir(False, "a última rodada terminou às %s UTC, há %.0f min; o descanso é de %d min: "
                             "esta fica de fora" % (fim.strftime("%H:%M"), passou, PAUSA))
          decidir(True, "a última rodada terminou às %s UTC, há %.0f min: roda" % (fim.strftime("%H:%M"), passou))
          PY

  atualizar:
    needs: ritmo
    if: needs.ritmo.outputs.rodar == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install --quiet pandas requests openpyxl

      - name: Gerar gestao_pcm.json (via API Fracttal)
        env:
          FRACTTAL_CLIENT_ID: ${{ secrets.FRACTTAL_CLIENT_ID }}
          FRACTTAL_CLIENT_SECRET: ${{ secrets.FRACTTAL_CLIENT_SECRET }}
          FRACTTAL_BASE_URL: https://app.fracttal.com/api/
          PCM_PROG_DIR: ${{ github.workspace }}
          GESTAO_AUXILIAR_PATH: ${{ github.workspace }}/AUXILIAR_gestao.xlsx
        run: python gerar_gestao_pcm_json.py

      - name: Gerar engenharia.json (módulo Confiabilidade)
        env:
          FRACTTAL_CLIENT_ID: ${{ secrets.FRACTTAL_CLIENT_ID }}
          FRACTTAL_CLIENT_SECRET: ${{ secrets.FRACTTAL_CLIENT_SECRET }}
          FRACTTAL_BASE_URL: https://app.fracttal.com/api/
          PCM_PROG_DIR: ${{ github.workspace }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ENG_EMAIL_PARA: ${{ secrets.ENG_EMAIL_PARA }}
        run: python gerar_engenharia_json.py

      - name: Relatórios por e-mail (diário 06:00 · tarde 13:00 · semana sex 17:00 · alerta da programação)
        env:
          PCM_PROG_DIR: ${{ github.workspace }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          RELATORIO_DIARIO_PARA: ${{ secrets.RELATORIO_DIARIO_PARA }}
          RELATORIO_MATINAL_PARA: ${{ secrets.RELATORIO_MATINAL_PARA }}
          RELATORIO_SEMANAL_PARA: ${{ secrets.RELATORIO_SEMANAL_PARA }}
          RELATORIO_ALERTA_PARA: ${{ secrets.RELATORIO_ALERTA_PARA }}
        run: python relatorio_diario.py

      - name: Publicar só se os dados mudaram (anti-churn)
        run: |
          NEW_HASH=$(python - <<'EOF'
          import json, hashlib
          def ler(p):
              try:
                  with open(p, encoding='utf-8') as f: return json.load(f)
              except Exception: return {}
          g = ler('gestao_pcm.json'); e = ler('engenharia.json'); r = ler('gerencial.json'); n = ler('engenharia/notificacoes.json')
          # o que muda a cada rodada sem dado novo fica de fora
          r.pop('geradoEm', None); r.pop('resumo', None)
          n.pop('ultimaRodada', None)
          partes = [g.get('dataHash', ''), e.get('dataHash', ''),
                    json.dumps(r, sort_keys=True, ensure_ascii=False),
                    json.dumps(n, sort_keys=True, ensure_ascii=False)]
          print(hashlib.sha256('|'.join(partes).encode('utf-8')).hexdigest())
          EOF
          )
          OLD_HASH=$(cat _gestao_pcm_published_hash.txt 2>/dev/null || echo "")
          # relatório diário novo (1x/dia) publica mesmo com os dados iguais
          RELATORIO_NOVO=$(git status --porcelain relatorios 2>/dev/null | head -1)
          if [ -n "$NEW_HASH" ] && [ "$NEW_HASH" = "$OLD_HASH" ] && [ -z "$RELATORIO_NOVO" ]; then
            echo "Dados sem mudança (hash $NEW_HASH) — nada a publicar."
            exit 0
          fi
          echo "$NEW_HASH" > _gestao_pcm_published_hash.txt
          git config user.name  "gestao-pcm-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gestao_pcm.json _gestao_pcm_published_hash.txt engenharia.json gerencial.json engenharia/notificacoes.json
          git add -A relatorios 2>/dev/null || true
          git commit -m "chore: dados do Gestão PCM / Confiabilidade / Gerencial [auto ${NEW_HASH:0:8}]" || { echo "nada a commitar"; exit 0; }
          # O robô da Programação Semanal commita a cada poucos minutos. Se o main andou,
          # rebaseia; se o rebase conflitar num arquivo gerado, fica com a versão DESTA
          # rodada (no rebase, "theirs" é o commit sendo reaplicado, ou seja, o nosso).
          GERADOS="gestao_pcm.json engenharia.json gerencial.json engenharia/notificacoes.json _gestao_pcm_published_hash.txt relatorios"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs -- $GERADOS 2>/dev/null || true
              git add -A $GERADOS 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; echo "rebase falhou — tentativa $i"; sleep 5; continue; }
            fi
            if git push origin HEAD:main; then
              echo "Publicado (tentativa $i)."; exit 0
            fi
            echo "Push colidiu — nova tentativa em 5s ($i/5)..."; sleep 5
          done
          echo "Falhou após 5 tentativas."; exit 1
