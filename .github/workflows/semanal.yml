name: Atualiza Programação Semanal (a cada 15 min)

# GATILHOS — por que são três
#
# `schedule` sozinho fazia a semana esperar pela fila do cron. Medido em 21/08:
# o `*/15` entrega na prática uma rodada a cada ~38 min (intervalos de 28 a 57),
# porque o GitHub descarta a maioria dos agendamentos em horário redondo. Como o
# motor leva 6 min, publicar uma Programação Semana XX podia demorar ~63 min para
# aparecer no painel — e 90% disso era espera, não trabalho.
#
# O `push` corrige isso: publicar a semana (ou mexer nas observações) dispara o
# motor na hora.
#
# NÃO cria laço: o robô commita com o GITHUB_TOKEN, e o GitHub não dispara
# workflows a partir dele (proteção anti-loop). Além disso, `banco_dados.json` e
# `etiquetas.json` — o que ele publica — não estão no `paths` abaixo.
#
# NÃO cria corrida: o `concurrency` mais abaixo põe a rodada nova na fila em vez
# de colidir com uma em andamento.
#
# Mudança de CÓDIGO não dispara de propósito. O cron pega na próxima, e quem tiver
# pressa usa o Run workflow — melhor que cada commit custar 6 min de execução.
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      # Sem acento no padrão de propósito: casa "Programação Semana 35.xlsx" e
      # evita qualquer dúvida de codificação no glob.
      - "Programa*.xlsx"
      - "Observacoes_Semana*.txt"
      - "AUXILIAR - FABRICIO.xlsx"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: semanal
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install --quiet pandas requests openpyxl python-calamine

      - name: Restaurar insumos sensíveis (dos Secrets — RPN e Confiabilidade)
        run: |
          printf '%s' "${{ secrets.LISTA_PRIORIDADES_B64 }}" | base64 -d > "Lista_Prioridades_GridCo.xlsx"
          printf '%s' "${{ secrets.CONFIABILIDADE_B64 }}"    | base64 -d > "Planilha Confiabilidade R00.xlsx"

      - name: Rodar o motor semanal
        env:
          FRACTTAL_CLIENT_ID: ${{ secrets.FRACTTAL_CLIENT_ID }}
          FRACTTAL_CLIENT_SECRET: ${{ secrets.FRACTTAL_CLIENT_SECRET }}
          FRACTTAL_BASE_URL: https://app.fracttal.com/api/
          PCM_PROG_DIR: ${{ github.workspace }}
        run: |
          python atualizacao_semanal.py
          python gerar_pcm_json.py
          python gerar_etiquetas_json.py --bd "AUXILIAR - FABRICIO.xlsx"

      - name: Publicar banco_dados.json + etiquetas.json
        run: |
          rm -f "Lista_Prioridades_GridCo.xlsx" "Planilha Confiabilidade R00.xlsx"
          git config user.name  "semanal-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banco_dados.json etiquetas.json
          if git diff --cached --quiet; then
            echo "Sem mudancas nos JSONs."; exit 0
          fi
          git commit -m "chore: refresh Programacao Semanal [auto]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then echo "Publicado (tentativa $i)."; exit 0; fi
            echo "Push colidiu — nova tentativa em 5s ($i/5)..."; sleep 5
          done
          echo "Falhou apos 5 tentativas."; exit 1
