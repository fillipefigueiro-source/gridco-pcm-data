      - name: Publicar banco_dados.json + etiquetas.json
        run: |
          rm -f "Lista_Prioridades_GridCo.xlsx" "Planilha Confiabilidade R00.xlsx"
          set -uo pipefail

          GUARDA="$(mktemp -d)"
          cp banco_dados.json etiquetas.json "$GUARDA/"

          # Impressão digital do conteúdo REAL: os dois arquivos, sem o carimbo.
          NOVO=$(python3 - <<'PY'
          import json, hashlib
          h = hashlib.sha256()
          for f in ("banco_dados.json", "etiquetas.json"):
              with open(f, encoding="utf-8") as fp:
                  d = json.load(fp)
              if isinstance(d, dict):
                  d.pop("geradoEm", None)
              h.update(json.dumps(d, sort_keys=True, ensure_ascii=False, default=str).encode("utf-8"))
          print(h.hexdigest())
          PY
          )
          [ -n "$NOVO" ] || { echo "Nao consegui calcular o hash do conteudo."; exit 1; }

          AGORA="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DADOS_DE=$(python3 -c "import json;print(json.load(open('banco_dados.json',encoding='utf-8')).get('geradoEm',''))")

          git config user.name  "semanal-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            git fetch --quiet origin main || { echo "fetch falhou ($i/5)"; sleep 5; continue; }
            git reset --quiet --hard origin/main

            ANTIGO=$(cat _semanal_hash.txt 2>/dev/null || echo "")

            printf '{"verificadoEm":"%s","dadosDe":"%s","hash":"%s"}\n' \
                   "$AGORA" "$DADOS_DE" "${NOVO:0:12}" > _robo_pulso.json

            if [ "$NOVO" = "$ANTIGO" ]; then
              git add _robo_pulso.json
              ACAO="pulso (dado inalterado, hash ${NOVO:0:8})"
            else
              cp "$GUARDA/banco_dados.json" "$GUARDA/etiquetas.json" .
              echo "$NOVO" > _semanal_hash.txt
              git add banco_dados.json etiquetas.json _semanal_hash.txt _robo_pulso.json
              ACAO="dados novos (hash ${NOVO:0:8})"
            fi

            if git diff --cached --quiet; then
              echo "Nada a publicar."; exit 0
            fi

            git commit --quiet -m "chore: $ACAO [auto]"
            if git push --quiet origin HEAD:main; then
              echo "Publicado (tentativa $i): $ACAO"; exit 0
            fi
            echo "Push colidiu - nova tentativa ($i/5)..."; sleep 5
          done

          echo "Falhou apos 5 tentativas."; exit 1
