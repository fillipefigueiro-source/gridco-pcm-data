# Melhoria 5 — deploy do painel no Azure Static Web Apps (decisão 25).
#
# INERTE de propósito: fora de .github/workflows/ o GitHub não executa.
# Para LIGAR (depois que o recurso SWA existir no Azure e o segredo
# AZURE_STATIC_WEB_APPS_API_TOKEN estiver cadastrado no repositório), o DONO
# do repositório copia este arquivo para .github/workflows/azure-swa.yml
# (o token do robô não tem escopo workflow — por isso ele mora aqui)
#
# O robô não muda: ele continua commitando os .json; cada push dispara este
# deploy, que copia o conteúdo do repositório para o SWA (sem build).
name: Deploy Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "*.json"
      - "staticwebapp.config.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar dados para a API (fase 2 — filtro por papel)
        run: |
          mkdir -p api/data
          cp banco_dados.json api/data/
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/"
          api_location: "api"
          skip_app_build: true
