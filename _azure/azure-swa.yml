# Melhoria 5 — deploy do painel no Azure Static Web Apps (decisão 25).
name: Deploy Azure Static Web Apps

on:
  workflow_run:
    workflows:
      - "Atualiza Programação Semanal (a cada 15 min)"
      - "Atualiza Gestão PCM (a cada 15 min)"
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "*.json"
      - "staticwebapp.config.json"
      - "api/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar dados para a API (fase 2 — filtro por papel)
        run: |
          mkdir -p api/data
          cp banco_dados.json api/data/
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/"
          api_location: "api"
          skip_app_build: true
